# Pure MIDI: Standard MIDI File reading and writing, the message hierarchy, the tempo map and note
# pairing. It depends on kotlin-stdlib only.
product:
  type: kmp/lib
  platforms:
    - jvm
    - android
    - js
    - wasmJs
    - iosArm64
    - iosSimulatorArm64
    - iosX64
    - macosArm64

apply:
  - ../library.module-template.yaml
  - ../kmp.module-template.yaml

settings:
  android:
    namespace: io.github.yuroyami.kiteaudio.midi
    minSdk: 23
  publishing:
    pom:
      name: KiteAudio MIDI
      description: >-
        MIDI for Kotlin Multiplatform. Reads and writes Standard MIDI Files in formats 0, 1 and 2, including running
        status, meta events and system exclusive. Provides a typed message hierarchy, a tempo map that converts ticks
        to microseconds in both directions, key-down note pairing, and helpers for universal system exclusive messages
        such as device inquiry and master tuning. kotlin-stdlib only.

# Pin the klib name to "io.github.yuroyami:kiteaudio-midi", the group and artifact name. The committed
# klib ABI dump records this name. Set it per platform: on @native, it also renames the
# klibs of shared native code, which must keep their own names.
settings@js:
  kotlin:
    freeCompilerArgs: [ -Xir-module-name=io.github.yuroyami:kiteaudio-midi ]

settings@wasmJs:
  kotlin:
    freeCompilerArgs: [ -Xir-module-name=io.github.yuroyami:kiteaudio-midi ]

settings@iosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kiteaudio-midi, -Xshort-module-name=kiteaudio-midi ]

settings@iosSimulatorArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kiteaudio-midi, -Xshort-module-name=kiteaudio-midi ]

settings@iosX64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kiteaudio-midi, -Xshort-module-name=kiteaudio-midi ]

settings@macosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kiteaudio-midi, -Xshort-module-name=kiteaudio-midi ]

# Tests compile into their own klib, which needs a different name. The test blocks name the
# same platforms as the blocks above, so the toolchain applies them last.
test-settings@js:
  kotlin:
    freeCompilerArgs: [ -Xir-module-name=kiteaudio-midi_test ]

test-settings@wasmJs:
  kotlin:
    freeCompilerArgs: [ -Xir-module-name=kiteaudio-midi_test ]

test-settings@iosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=kiteaudio-midi_test, -Xshort-module-name=kiteaudio-midi_test ]

test-settings@iosSimulatorArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=kiteaudio-midi_test, -Xshort-module-name=kiteaudio-midi_test ]

test-settings@iosX64:
  kotlin:
    freeCompilerArgs: [ -module-name=kiteaudio-midi_test, -Xshort-module-name=kiteaudio-midi_test ]

test-settings@macosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=kiteaudio-midi_test, -Xshort-module-name=kiteaudio-midi_test ]

plugins:
  abi-check:
    enabled: true
    # The klibAbi check reads the klibs of these platforms, so run `./kotlin build` first.
    klibPlatforms: [ iosArm64, iosSimulatorArm64, iosX64, js, macosArm64, wasmJs ]
  dokka:
    enabled: true
    moduleName: kiteaudio-midi
    footerMessage: Apache-2.0 · KiteAudio is part of the Kite family.
    sourceLinkUrl: https://github.com/yuroyami/KiteAudio/blob/main/kiteaudio-midi/src

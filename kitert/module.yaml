# Real-time audio: a render callback, a lock-free ring, and one sink per platform.
# The API keeps KitePlayer's names on purpose, so the two can be merged later rather than translated.
product:
  type: kmp/lib
  platforms:
    - jvm
    - android
    - iosArm64
    - iosSimulatorArm64
    - iosX64
    - macosArm64

# `./kotlin publish mavenLocal -m kitert` puts a build into ~/.m2 for tests in other projects.
repositories:
  - url: mavenLocal
    publish: true
    resolve: false

settings:
  kotlin:
    # Keep abi-tools in build-plugins/abi-check/module.yaml at the same version.
    version: 2.4.21
    explicitApi: strict
  jvm:
    jdk:
      version: 21
  android:
    namespace: io.github.yuroyami.kitert
    compileSdk:
      apiLevel: 37
      minorApiLevel: 2
    minSdk: 23
  publishing:
    enabled: true
    group: io.github.yuroyami
    version: 0.1.0
    pom:
      name: KiteRT
      description: >-
        Callback-based mono and stereo audio output for Kotlin Multiplatform. Accepts interleaved Float32 samples and
        outputs 16-bit PCM through Java Sound on the JVM, AudioTrack on Android and AudioQueue on Apple platforms.
      url: https://github.com/yuroyami/KiteRT
      licenses:
        - name: The Apache License, Version 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0.txt
      developers:
        - id: yuroyami
          name: yuroyami
          url: https://github.com/yuroyami
      scm:
        url: https://github.com/yuroyami/KiteRT
        connection: scm:git:git://github.com/yuroyami/KiteRT.git
        developerConnection: scm:git:ssh://git@github.com/yuroyami/KiteRT.git
    signArtifacts: true
    publishSources: true
    mavenCentral:
      enabled: true
      publishingMode: auto

# -Xexport-kdoc keeps the KDoc in the native klibs. If the module already has a
# settings@native block, add the flag to that block instead.
settings@native:
  kotlin:
    freeCompilerArgs: [ -Xexport-kdoc ]

# Gradle named the klib "io.github.yuroyami:kitert". Keep that name, or libraries built against
# earlier releases fail to link on Kotlin/Native. Set it per platform: on @native, it also
# renames the klibs of shared native code, which must keep their own names.
settings@iosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kitert, -Xshort-module-name=kitert ]

settings@iosSimulatorArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kitert, -Xshort-module-name=kitert ]

settings@iosX64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kitert, -Xshort-module-name=kitert ]

settings@macosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kitert, -Xshort-module-name=kitert ]

# Tests compile into their own klib, which needs a different name. The test blocks name the
# same platforms as the blocks above, so the toolchain applies them last.
test-settings@iosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=kitert_test, -Xshort-module-name=kitert_test ]

test-settings@iosSimulatorArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=kitert_test, -Xshort-module-name=kitert_test ]

test-settings@iosX64:
  kotlin:
    freeCompilerArgs: [ -module-name=kitert_test, -Xshort-module-name=kitert_test ]

test-settings@macosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=kitert_test, -Xshort-module-name=kitert_test ]

plugins:
  abi-check:
    enabled: true
    # The klibAbi check reads the klibs of these platforms, so run `./kotlin build` first.
    klibPlatforms: [ iosArm64, iosSimulatorArm64, iosX64, macosArm64 ]
  dokka:
    enabled: true
    moduleName: kitert
    footerMessage: Apache-2.0 · KiteRT is part of the Kite family.
    sourceLinkUrl: https://github.com/yuroyami/KiteRT/blob/main/kitert/src

# The audio format types that the other KiteAudio modules share.
product:
  type: kmp/lib
  platforms:
    - jvm
    - android
    - js
    - wasmJs
    - wasmWasi
    - iosArm64
    - iosSimulatorArm64
    - iosX64
    - macosArm64
    - tvosArm64
    - tvosSimulatorArm64
    - watchosArm32
    - watchosArm64
    - watchosDeviceArm64
    - watchosSimulatorArm64
    - linuxX64
    - linuxArm64
    - mingwX64
    - androidNativeArm32
    - androidNativeArm64
    - androidNativeX86
    - androidNativeX64

apply:
  - ../library.module-template.yaml
  - ../kmp.module-template.yaml

# No dependencies. The core module depends on kotlin-stdlib only.

settings:
  android:
    namespace: io.github.yuroyami.kiteaudio.core
    minSdk: 21
  publishing:
    pom:
      name: KiteAudio Core
      description: >-
        The shared audio format types of the KiteAudio modules: the sample rate, the channel layout and a pull-based
        stream of Float32 PCM. Depends on kotlin-stdlib only.

# Pin the klib name to "io.github.yuroyami:kiteaudio-core", the group and artifact name.
# The committed klib ABI dump records this name. The web test runner finds the test klib
# by the test name below. Set it per platform: on @native, it also renames the klibs of
# shared native code, which must keep their own names.
settings@js:
  kotlin:
    freeCompilerArgs: [ -Xir-module-name=io.github.yuroyami:kiteaudio-core ]

settings@wasmJs:
  kotlin:
    freeCompilerArgs: [ -Xir-module-name=io.github.yuroyami:kiteaudio-core ]

settings@wasmWasi:

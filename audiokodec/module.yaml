product:
  type: kmp/lib
  platforms:
    - jvm
    - android
    - js
    - wasmJs
    - wasmWasi
    - iosArm64
    - iosSimulatorArm64
    - iosX64
    - macosArm64
    - tvosArm64
    - tvosSimulatorArm64
    - watchosArm32
    - watchosArm64
    - watchosDeviceArm64
    - watchosSimulatorArm64
    - linuxX64
    - linuxArm64
    - mingwX64
    - androidNativeArm32
    - androidNativeArm64
    - androidNativeX86
    - androidNativeX64

apply:
  - ../library.module-template.yaml
  - ../kmp.module-template.yaml
  - ../codec.module-template.yaml

# Intentionally no dependencies. The AudioKodec core depends on kotlin-stdlib only.

settings:
  jvm:
    test:
      # The allocation guard allows 1 GiB of decoded PCM, and the fuzz suite drives malformed
      # headers up to it. The heap must be large enough that the guard rejects the input first.
      freeJvmArgs: [ -Xmx3g ]
  android:
    namespace: io.github.yuroyami.audiokodec
  publishing:
    pom:
      name: AudioKodec
      description: >-
        Audio containers, codecs and tags written in Kotlin for Kotlin Multiplatform. Decodes 22 containers to Float32 PCM,
        among them FLAC, WAV, AIFF, MP3, Ogg Vorbis and Opus, AAC, ALAC, AC-3, Matroska, WavPack and Monkey's Audio.
        Encodes FLAC, WAV, AIFF, AU and ALAC. Reads and edits ID3, APE, Vorbis comment, MP4 and RIFF tags with the audio
        left byte-identical. Names 30 formats by sniffing. Depends on kotlin-stdlib only and builds for 22 targets.

# Gradle named the klib "io.github.yuroyami:audiokodec". Keep that name, or libraries built against
# earlier releases fail to link on Kotlin/Native. Set it per platform: on @native, it also
# renames the klibs of shared native code, which must keep their own names.
settings@js:
  kotlin:
    freeCompilerArgs: [ -Xir-module-name=io.github.yuroyami:audiokodec ]


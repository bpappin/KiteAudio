# A sample-based synthesiser in common Kotlin. It reads a SoundFont, takes MIDI messages and renders
# Float32 PCM. It depends on kotlin-stdlib only. Handing those samples to a real device is KiteRT's job.
product:
  type: kmp/lib
  platforms:
    - jvm
    - android
    - js
    - wasmJs
    - iosArm64
    - iosSimulatorArm64
    - iosX64
    - macosArm64
    - linuxX64
    - linuxArm64
    - mingwX64

apply:
  - ../library.module-template.yaml
  - ../kmp.module-template.yaml

settings:
  android:
    namespace: io.github.yuroyami.kiteaudio.synth
    minSdk: 23
  publishing:
    pom:
      name: KiteAudio Synth
      description: >-
        SoundFont reading, writing and sample-based synthesis for Kotlin Multiplatform. Renders stereo Float32 PCM
        with envelopes, modulation, filtering, reverb and chorus. Retains SF3 samples for an application-provided
        decoder. The common core depends only on kotlin-stdlib.

# Pin the klib name to "io.github.yuroyami:kiteaudio-synth", the group and artifact name. The committed
# klib ABI dump records this name. Set it per platform: on @native, it also renames the
# klibs of shared native code, which must keep their own names.
settings@js:
  kotlin:
    freeCompilerArgs: [ -Xir-module-name=io.github.yuroyami:kiteaudio-synth ]

settings@wasmJs:
  kotlin:
    freeCompilerArgs: [ -Xir-module-name=io.github.yuroyami:kiteaudio-synth ]

settings@iosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kiteaudio-synth, -Xshort-module-name=kiteaudio-synth ]

settings@iosSimulatorArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kiteaudio-synth, -Xshort-module-name=kiteaudio-synth ]

settings@iosX64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kiteaudio-synth, -Xshort-module-name=kiteaudio-synth ]

settings@macosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kiteaudio-synth, -Xshort-module-name=kiteaudio-synth ]

settings@linuxX64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kiteaudio-synth, -Xshort-module-name=kiteaudio-synth ]

settings@linuxArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kiteaudio-synth, -Xshort-module-name=kiteaudio-synth ]

settings@mingwX64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kiteaudio-synth, -Xshort-module-name=kiteaudio-synth ]

# Tests compile into their own klib, which needs a different name. The test blocks name the
# same platforms as the blocks above, so the toolchain applies them last.
test-settings@js:
  kotlin:
    freeCompilerArgs: [ -Xir-module-name=kiteaudio-synth_test ]

test-settings@wasmJs:
  kotlin:
    freeCompilerArgs: [ -Xir-module-name=kiteaudio-synth_test ]

test-settings@iosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=kiteaudio-synth_test, -Xshort-module-name=kiteaudio-synth_test ]

test-settings@iosSimulatorArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=kiteaudio-synth_test, -Xshort-module-name=kiteaudio-synth_test ]

test-settings@iosX64:
  kotlin:
    freeCompilerArgs: [ -module-name=kiteaudio-synth_test, -Xshort-module-name=kiteaudio-synth_test ]

test-settings@macosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=kiteaudio-synth_test, -Xshort-module-name=kiteaudio-synth_test ]

test-settings@linuxX64:
  kotlin:
    freeCompilerArgs: [ -module-name=kiteaudio-synth_test, -Xshort-module-name=kiteaudio-synth_test ]

test-settings@linuxArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=kiteaudio-synth_test, -Xshort-module-name=kiteaudio-synth_test ]

test-settings@mingwX64:
  kotlin:
    freeCompilerArgs: [ -module-name=kiteaudio-synth_test, -Xshort-module-name=kiteaudio-synth_test ]

plugins:
  abi-check:
    enabled: true
    # The klibAbi check reads the klibs of these platforms, so run `./kotlin build` first.
    klibPlatforms: [ iosArm64, iosSimulatorArm64, iosX64, js, linuxArm64, linuxX64, macosArm64, mingwX64, wasmJs ]
  dokka:
    enabled: true
    moduleName: kiteaudio-synth
    footerMessage: Apache-2.0 · KiteAudio is part of the Kite family.
    sourceLinkUrl: https://github.com/yuroyami/KiteAudio/blob/main/kiteaudio-synth/src

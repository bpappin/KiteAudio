# A sample-based synthesizer in common Kotlin. It reads a SoundFont, takes MIDI messages and renders
# Float32 PCM. It depends on kotlin-stdlib only. kiteaudio-output sends those samples to a device.
product:
  type: kmp/lib
  platforms:
    - jvm
    - android
    - js
    - wasmJs
    - wasmWasi
    - iosArm64
    - iosSimulatorArm64
    - iosX64
    - macosArm64
    - tvosArm64
    - tvosSimulatorArm64
    - watchosArm32
    - watchosArm64
    - watchosDeviceArm64
    - watchosSimulatorArm64
    - linuxX64
    - linuxArm64
    - mingwX64
    - androidNativeArm32
    - androidNativeArm64
    - androidNativeX86
    - androidNativeX64

apply:
  - ../library.module-template.yaml
  - ../kmp.module-template.yaml

settings:
  android:
    namespace: io.github.yuroyami.kiteaudio.synth
    minSdk: 23
  publishing:
    pom:
      name: KiteAudio Synth
      description: >-
        SoundFont reading, writing and sample-based synthesis for Kotlin Multiplatform. Renders stereo Float32 PCM
        with envelopes, modulation, filtering, reverb and chorus. Retains SF3 samples for an application-provided
        decoder. The common core depends only on kotlin-stdlib.

# Pin the klib name to "io.github.yuroyami:kiteaudio-synth", the group and artifact name. The committed
# klib ABI dump records this name. Set it per platform: on @native, it also renames the
# klibs of shared native code, which must keep their own names.
settings@js:
  kotlin:
    freeCompilerArgs: [ -Xir-module-name=io.github.yuroyami:kiteaudio-synth ]

settings@wasmJs:
  kotlin:
    freeCompilerArgs: [ -Xir-module-name=io.github.yuroyami:kiteaudio-synth ]


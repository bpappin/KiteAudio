product:
  type: kmp/lib
  platforms:
    - jvm
    - android
    - js
    - wasmJs
    - wasmWasi
    - iosArm64
    - iosSimulatorArm64
    - iosX64
    - macosArm64
    - tvosArm64
    - tvosSimulatorArm64
    - watchosArm32
    - watchosArm64
    - watchosDeviceArm64
    - watchosSimulatorArm64
    - linuxX64
    - linuxArm64
    - mingwX64
    - androidNativeArm32
    - androidNativeArm64
    - androidNativeX86
    - androidNativeX64

apply:
  - ../library.module-template.yaml

# The JVM and Android file code in src@jvmShared.
aliases:
  - jvmShared: [ jvm, android ]

dependencies:
  - //audiokodec: exported
  - $libs.kotlinx.io.core: exported

settings:
  android:
    namespace: io.github.yuroyami.audiokodec.io
  publishing:
    pom:
      name: AudioKodec kotlinx-io
      description: >-
        kotlinx-io bridge for AudioKodec. Reads a Path or RawSource into an AudioSource, and writes an encoder's output
        to a Sink or a Path. Optional; the AudioKodec core needs no dependency beyond kotlin-stdlib.

# Gradle named the klib "io.github.yuroyami:audiokodec-io". Keep that name, or libraries built against
# earlier releases fail to link on Kotlin/Native. Set it per platform: on @native, it also
# renames the klibs of shared native code, which must keep their own names.
settings@js:
  kotlin:
    freeCompilerArgs: [ -Xir-module-name=io.github.yuroyami:audiokodec-io ]

settings@wasmJs:
  kotlin:
    freeCompilerArgs: [ -Xir-module-name=io.github.yuroyami:audiokodec-io ]

settings@wasmWasi:
  kotlin:
    freeCompilerArgs: [ -Xir-module-name=io.github.yuroyami:audiokodec-io ]

settings@iosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:audiokodec-io, -Xshort-module-name=audiokodec-io ]

settings@iosSimulatorArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:audiokodec-io, -Xshort-module-name=audiokodec-io ]

settings@iosX64:
  kotlin:

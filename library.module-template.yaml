# Settings that every published module shares. Each library's module.yaml applies this file
# and adds its own platforms, dependencies, Android namespace and POM text.

# `./kotlin publish mavenLocal -m <module>` puts a build into ~/.m2 for tests in other projects.
repositories:
  - url: mavenLocal
    publish: true
    resolve: false

settings:
  kotlin:
    # Keep abi-tools in build-plugins/abi-check/module.yaml at the same version.
    version: 2.4.21
    explicitApi: strict
  jvm:
    jdk:
      version: 21
  publishing:
    enabled: true
    group: io.github.yuroyami
    version: 0.3.0
    pom:
      url: https://github.com/yuroyami/KiteAudio
      licenses:
        - name: The Apache License, Version 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0.txt
      developers:
        - id: yuroyami
          name: yuroyami
          url: https://github.com/yuroyami
      scm:
        url: https://github.com/yuroyami/KiteAudio
        connection: scm:git:git://github.com/yuroyami/KiteAudio.git
        developerConnection: scm:git:ssh://git@github.com/yuroyami/KiteAudio.git
    signArtifacts: true
    publishSources: true
    mavenCentral:
      enabled: true
      publishingMode: auto

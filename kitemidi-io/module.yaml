# Real MIDI hardware: MidiManager on Android, CoreMIDI on Apple and javax.sound.midi on the JVM.
# It needs coroutines and platform APIs, so it is a separate artifact and the core stays portable.
# CoreMIDI needs no cinterop: Kotlin/Native ships it as a platform library.
product:
  type: kmp/lib
  platforms:
    - jvm
    - android
    - iosArm64
    - iosSimulatorArm64
    - iosX64
    - macosArm64

dependencies:
  - //kitemidi: exported
  - $libs.coroutines.core: exported

test-dependencies:
  - $libs.coroutines.test

# `./kotlin publish mavenLocal -m kitemidi-io` puts a build into ~/.m2 for tests in other projects.
repositories:
  - url: mavenLocal
    publish: true
    resolve: false

settings:
  kotlin:
    # Keep abi-tools in build-plugins/abi-check/module.yaml at the same version.
    version: 2.4.21
    explicitApi: strict
    optIns: [ kotlin.experimental.ExperimentalNativeApi ]
  jvm:
    jdk:
      version: 21
  android:
    namespace: io.github.yuroyami.kitemidi.io
    compileSdk:
      apiLevel: 37
      minorApiLevel: 2
    minSdk: 23
  publishing:
    enabled: true
    group: io.github.yuroyami
    version: 0.2.0
    pom:
      name: KiteMIDI IO
      description: >-
        MIDI device input and output for Kotlin Multiplatform. Enumerates ports, opens them and carries typed messages
        both ways, over MidiManager on Android, CoreMIDI on Apple and javax.sound.midi on the JVM. Includes a byte-
        stream parser that handles running status and system exclusive split across packets.
      url: https://github.com/yuroyami/KiteMIDI
      licenses:
        - name: The Apache License, Version 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0.txt
      developers:
        - id: yuroyami
          name: yuroyami
          url: https://github.com/yuroyami
      scm:
        url: https://github.com/yuroyami/KiteMIDI
        connection: scm:git:git://github.com/yuroyami/KiteMIDI.git
        developerConnection: scm:git:ssh://git@github.com/yuroyami/KiteMIDI.git
    signArtifacts: true
    publishSources: true
    mavenCentral:
      enabled: true
      publishingMode: auto

# -Xexport-kdoc keeps the KDoc in the native klibs. If the module already has a
# settings@native block, add the flag to that block instead.
settings@native:
  kotlin:
    freeCompilerArgs: [ -Xexport-kdoc ]
    # kotlinx.cinterop exists only on native, so the JVM and Android builds do not get this opt-in.
    optIns: [ kotlinx.cinterop.ExperimentalForeignApi, kotlin.experimental.ExperimentalNativeApi ]

# Gradle named the klib "io.github.yuroyami:kitemidi-io". Keep that name, or libraries built against
# earlier releases fail to link on Kotlin/Native. Set it per platform: on @native, it also
# renames the klibs of shared native code, which must keep their own names.
settings@iosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kitemidi-io, -Xshort-module-name=kitemidi-io ]

settings@iosSimulatorArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kitemidi-io, -Xshort-module-name=kitemidi-io ]

settings@iosX64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kitemidi-io, -Xshort-module-name=kitemidi-io ]

settings@macosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kitemidi-io, -Xshort-module-name=kitemidi-io ]

# Tests compile into their own klib, which needs a different name. The test blocks name the
# same platforms as the blocks above, so the toolchain applies them last.
test-settings@iosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=kitemidi-io_test, -Xshort-module-name=kitemidi-io_test ]

test-settings@iosSimulatorArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=kitemidi-io_test, -Xshort-module-name=kitemidi-io_test ]

test-settings@iosX64:
  kotlin:
    freeCompilerArgs: [ -module-name=kitemidi-io_test, -Xshort-module-name=kitemidi-io_test ]

test-settings@macosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=kitemidi-io_test, -Xshort-module-name=kitemidi-io_test ]

plugins:
  abi-check:
    enabled: true
    # The klibAbi check reads the klibs of these platforms, so run `./kotlin build` first.
    klibPlatforms: [ iosArm64, iosSimulatorArm64, iosX64, macosArm64 ]
  dokka:
    enabled: true
    moduleName: kitemidi-io
    footerMessage: Apache-2.0 · KiteMIDI is part of the Kite family.
    sourceLinkUrl: https://github.com/yuroyami/KiteMIDI/blob/main/kitemidi-io/src

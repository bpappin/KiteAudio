# A sample-based synthesiser in common Kotlin. It reads a SoundFont, takes MIDI messages and renders
# Float32 PCM. It depends on kotlin-stdlib only. Handing those samples to a real device is KiteRT's job.
product:
  type: kmp/lib
  platforms:
    - jvm
    - android
    - iosArm64
    - iosSimulatorArm64
    - iosX64
    - macosArm64

# `./kotlin publish mavenLocal -m kitesynth` puts a build into ~/.m2 for tests in other projects.
repositories:
  - url: mavenLocal
    publish: true
    resolve: false

settings:
  kotlin:
    # Keep abi-tools in build-plugins/abi-check/module.yaml at the same version.
    version: 2.4.21
    explicitApi: strict
  jvm:
    jdk:
      version: 21
  android:
    namespace: io.github.yuroyami.kitesynth
    compileSdk:
      apiLevel: 37
      minorApiLevel: 2
    minSdk: 23
  publishing:
    enabled: true
    group: io.github.yuroyami
    version: 0.2.0
    pom:
      name: KiteSynth
      description: >-
        SoundFont reading, writing and sample-based synthesis for Kotlin Multiplatform. Renders stereo Float32 PCM
        with envelopes, modulation, filtering, reverb and chorus. Retains SF3 samples for an application-provided
        decoder. The common core depends only on kotlin-stdlib.
      url: https://github.com/yuroyami/KiteSynth
      licenses:
        - name: The Apache License, Version 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0.txt
      developers:
        - id: yuroyami
          name: yuroyami
          url: https://github.com/yuroyami
      scm:
        url: https://github.com/yuroyami/KiteSynth
        connection: scm:git:git://github.com/yuroyami/KiteSynth.git
        developerConnection: scm:git:ssh://git@github.com/yuroyami/KiteSynth.git
    signArtifacts: true
    publishSources: true
    mavenCentral:
      enabled: true
      publishingMode: auto

# -Xexport-kdoc keeps the KDoc in the native klibs. If the module already has a
# settings@native block, add the flag to that block instead.
settings@native:
  kotlin:
    freeCompilerArgs: [ -Xexport-kdoc ]

# Gradle named the klib "io.github.yuroyami:kitesynth". Keep that name, or libraries built against
# earlier releases fail to link on Kotlin/Native. Set it per platform: on @native, it also
# renames the klibs of shared native code, which must keep their own names.
settings@iosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kitesynth, -Xshort-module-name=kitesynth ]

settings@iosSimulatorArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kitesynth, -Xshort-module-name=kitesynth ]

settings@iosX64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kitesynth, -Xshort-module-name=kitesynth ]

settings@macosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kitesynth, -Xshort-module-name=kitesynth ]

# Tests compile into their own klib, which needs a different name. The test blocks name the
# same platforms as the blocks above, so the toolchain applies them last.
test-settings@iosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=kitesynth_test, -Xshort-module-name=kitesynth_test ]

test-settings@iosSimulatorArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=kitesynth_test, -Xshort-module-name=kitesynth_test ]

test-settings@iosX64:
  kotlin:
    freeCompilerArgs: [ -module-name=kitesynth_test, -Xshort-module-name=kitesynth_test ]

test-settings@macosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=kitesynth_test, -Xshort-module-name=kitesynth_test ]

plugins:
  abi-check:
    enabled: true
    # The klibAbi check reads the klibs of these platforms, so run `./kotlin build` first.
    klibPlatforms: [ iosArm64, iosSimulatorArm64, iosX64, macosArm64 ]
  dokka:
    enabled: true
    moduleName: kitesynth
    footerMessage: Apache-2.0 · KiteSynth is part of the Kite family.
    sourceLinkUrl: https://github.com/yuroyami/KiteSynth/blob/main/kitesynth/src

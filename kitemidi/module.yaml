# Pure MIDI: Standard MIDI File reading and writing, the message hierarchy, the tempo map and note
# pairing. It depends on kotlin-stdlib only.
product:
  type: kmp/lib
  platforms:
    - jvm
    - android
    - iosArm64
    - iosSimulatorArm64
    - iosX64
    - macosArm64

# `./kotlin publish mavenLocal -m kitemidi` puts a build into ~/.m2 for tests in other projects.
repositories:
  - url: mavenLocal
    publish: true
    resolve: false

settings:
  kotlin:
    # Keep abi-tools in build-plugins/abi-check/module.yaml at the same version.
    version: 2.4.21
    explicitApi: strict
  jvm:
    jdk:
      version: 21
  android:
    namespace: io.github.yuroyami.kitemidi
    compileSdk:
      apiLevel: 37
      minorApiLevel: 2
    minSdk: 23
  publishing:
    enabled: true
    group: io.github.yuroyami
    version: 0.2.0
    pom:
      name: KiteMIDI
      description: >-
        MIDI for Kotlin Multiplatform. Reads and writes Standard MIDI Files in formats 0, 1 and 2, including running
        status, meta events and system exclusive. Provides a typed message hierarchy, a tempo map that converts ticks
        to microseconds in both directions, key-down note pairing, and helpers for universal system exclusive messages
        such as device inquiry and master tuning. kotlin-stdlib only.
      url: https://github.com/yuroyami/KiteMIDI
      licenses:
        - name: The Apache License, Version 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0.txt
      developers:
        - id: yuroyami
          name: yuroyami
          url: https://github.com/yuroyami
      scm:
        url: https://github.com/yuroyami/KiteMIDI
        connection: scm:git:git://github.com/yuroyami/KiteMIDI.git
        developerConnection: scm:git:ssh://git@github.com/yuroyami/KiteMIDI.git
    signArtifacts: true
    publishSources: true
    mavenCentral:
      enabled: true
      publishingMode: auto

# -Xexport-kdoc keeps the KDoc in the native klibs. If the module already has a
# settings@native block, add the flag to that block instead.
settings@native:
  kotlin:
    freeCompilerArgs: [ -Xexport-kdoc ]

# Gradle named the klib "io.github.yuroyami:kitemidi". Keep that name, or libraries built against
# earlier releases fail to link on Kotlin/Native. Set it per platform: on @native, it also
# renames the klibs of shared native code, which must keep their own names.
settings@iosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kitemidi, -Xshort-module-name=kitemidi ]

settings@iosSimulatorArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kitemidi, -Xshort-module-name=kitemidi ]

settings@iosX64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kitemidi, -Xshort-module-name=kitemidi ]

settings@macosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kitemidi, -Xshort-module-name=kitemidi ]

# Tests compile into their own klib, which needs a different name. The test blocks name the
# same platforms as the blocks above, so the toolchain applies them last.
test-settings@iosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=kitemidi_test, -Xshort-module-name=kitemidi_test ]

test-settings@iosSimulatorArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=kitemidi_test, -Xshort-module-name=kitemidi_test ]

test-settings@iosX64:
  kotlin:
    freeCompilerArgs: [ -module-name=kitemidi_test, -Xshort-module-name=kitemidi_test ]

test-settings@macosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=kitemidi_test, -Xshort-module-name=kitemidi_test ]

plugins:
  abi-check:
    enabled: true
    # The klibAbi check reads the klibs of these platforms, so run `./kotlin build` first.
    klibPlatforms: [ iosArm64, iosSimulatorArm64, iosX64, macosArm64 ]
  dokka:
    enabled: true
    moduleName: kitemidi
    footerMessage: Apache-2.0 · KiteMIDI is part of the Kite family.
    sourceLinkUrl: https://github.com/yuroyami/KiteMIDI/blob/main/kitemidi/src
    # `./kotlin do dokkaSite` merges the pages of these modules into build/dokka/html.
    siteName: KiteMIDI
    siteModules: [ kitemidi, kitemidi-io, kitemidi-io-coremidi ]

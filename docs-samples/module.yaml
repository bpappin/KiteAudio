# The code samples that the documentation includes. Not published.
# Each sample is a test that runs and checks its result. docs/ includes the marked regions of
# these files. The module sees the two published modules and nothing else, so a sample can only
# use what a reader's project can. The JVM test runner only picks classes whose names end in
# Test, so each sample class does, while the file keeps the name that docs/ includes.
product: jvm/lib

test-dependencies:
  - //audiokodec
  - //audiokodec-io

settings:
  kotlin:
    version: 2.4.21
  jvm:
    jdk:
      version: 21
    test:
      systemProperties:
        # The Java Sound sample asks for a line, which needs no display.
        java.awt.headless: "true"
  junit: junit-4

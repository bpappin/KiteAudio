# Plays mono or stereo Float32 PCM on an audio output device: Java Sound on the JVM, AudioTrack on
# Android, AudioQueue on Apple platforms and Web Audio in a browser.
product:
  type: kmp/lib
  platforms:
    - jvm
    - android
    - js
    - wasmJs
    - iosArm64
    - iosSimulatorArm64
    - iosX64
    - macosArm64

apply:
  - ../library.module-template.yaml
  - ../kmp.module-template.yaml

dependencies:
  - //kiteaudio-core: exported

settings:
  android:
    namespace: io.github.yuroyami.kiteaudio.output
    minSdk: 23
  publishing:
    pom:
      name: KiteAudio Output
      description: >-
        Callback-based mono and stereo audio output for Kotlin Multiplatform. Accepts interleaved Float32 samples and
        outputs 16-bit PCM through Java Sound on the JVM, AudioTrack on Android and AudioQueue on Apple platforms, and
        Float32 through Web Audio in the browser.

# Pin the klib name to "io.github.yuroyami:kiteaudio-output", the group and artifact name. The committed
# klib ABI dump records this name. Set it per platform: on @native, it also renames the
# klibs of shared native code, which must keep their own names.
settings@js:
  kotlin:
    freeCompilerArgs: [ -Xir-module-name=io.github.yuroyami:kiteaudio-output ]

settings@wasmJs:
  kotlin:
    freeCompilerArgs: [ -Xir-module-name=io.github.yuroyami:kiteaudio-output ]

settings@iosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kiteaudio-output, -Xshort-module-name=kiteaudio-output ]

settings@iosSimulatorArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kiteaudio-output, -Xshort-module-name=kiteaudio-output ]

settings@iosX64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kiteaudio-output, -Xshort-module-name=kiteaudio-output ]

settings@macosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kiteaudio-output, -Xshort-module-name=kiteaudio-output ]

# Tests compile into their own klib, which needs a different name. The test blocks name the
# same platforms as the blocks above, so the toolchain applies them last.
test-settings@js:
  kotlin:
    freeCompilerArgs: [ -Xir-module-name=kiteaudio-output_test ]

test-settings@wasmJs:
  kotlin:
    freeCompilerArgs: [ -Xir-module-name=kiteaudio-output_test ]

test-settings@iosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=kiteaudio-output_test, -Xshort-module-name=kiteaudio-output_test ]

test-settings@iosSimulatorArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=kiteaudio-output_test, -Xshort-module-name=kiteaudio-output_test ]

test-settings@iosX64:
  kotlin:
    freeCompilerArgs: [ -module-name=kiteaudio-output_test, -Xshort-module-name=kiteaudio-output_test ]

test-settings@macosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=kiteaudio-output_test, -Xshort-module-name=kiteaudio-output_test ]

plugins:
  abi-check:
    enabled: true
    # The klibAbi check reads the klibs of these platforms, so run `./kotlin build` first.
    klibPlatforms: [ iosArm64, iosSimulatorArm64, iosX64, js, macosArm64, wasmJs ]
  dokka:
    enabled: true
    moduleName: kiteaudio-output
    footerMessage: Apache-2.0 · KiteAudio is part of the Kite family.
    sourceLinkUrl: https://github.com/yuroyami/KiteAudio/blob/main/kiteaudio-output/src

name: Docs

# Builds the API reference of every published module and the guides. It starts when
# library sources, the guides or the docs tooling change.
on:
  push:
    branches: [main]
    paths:
      - 'kiteaudio-*/src*/**'
      - 'kiteaudio-*/module.yaml'
      - 'kiteaudio-*/Module.md'
      - 'kiteaudio-codec/test@js/**'
      - 'docs/**'
      - 'docs-samples/**'
      - 'mkdocs.yml'
      - 'dokka-templates/**'
      - 'build-plugins/dokka/**'
      - 'kotlin'
      - 'project.yaml'
      - '*.module-template.yaml'
      - 'libs.versions.toml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'kiteaudio-*/src*/**'
      - 'kiteaudio-*/module.yaml'
      - 'kiteaudio-*/Module.md'
      - 'kiteaudio-codec/test@js/**'
      - 'docs/**'
      - 'docs-samples/**'
      - 'mkdocs.yml'
      - 'dokka-templates/**'
      - 'build-plugins/dokka/**'
      - 'kotlin'
      - 'project.yaml'
      - '*.module-template.yaml'
      - 'libs.versions.toml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KOTLIN_CLI_NO_WELCOME_BANNER: 1

jobs:
  docs:
    name: API documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache the Kotlin Toolchain downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/JetBrains/Kotlin
          key: kotlin-toolchain-${{ runner.os }}-${{ hashFiles('kotlin', 'project.yaml', '**/module.yaml', '*.module-template.yaml', 'libs.versions.toml', 'build-plugins/**/plugin.yaml') }}
          restore-keys: kotlin-toolchain-${{ runner.os }}-

      - name: Build the Dokka site
        run: |
          # `do` is a command of the kotlin script here, not the shell keyword.
          # shellcheck disable=SC1010
          ./kotlin do dokka && ./kotlin do dokkaSite

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # The guides include their code samples from compiled test sources; a
      # missing file or section marker fails the strict build.
      - name: Build the guides
        run: |
          python -m pip install mkdocs-material==9.7.7
          mkdocs build --strict

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-docs
          path: build/dokka/html

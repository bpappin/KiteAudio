name: MIDI, synth and output CI

# The MIDI, synth and output modules have their own workflow. A change that touches
# only the codec modules does not start it. See ci.yml and docs.yml.
on:
  push:
    branches: [main]
    paths:
      - 'kiteaudio-midi/**'
      - 'kiteaudio-midi-devices/**'
      - 'kiteaudio-midi-coremidi/**'
      - 'kiteaudio-synth/**'
      - 'kiteaudio-output/**'
      - 'kiteaudio-core/**'
      - 'kotlin'
      - 'kotlin.bat'
      - 'project.yaml'
      - 'library.module-template.yaml'
      - 'kmp.module-template.yaml'
      - 'libs.versions.toml'
      - 'build-plugins/**'
      - '.github/workflows/instruments.yml'
      - '.github/scripts/web-tests/**'
  pull_request:
    paths:
      - 'kiteaudio-midi/**'
      - 'kiteaudio-midi-devices/**'
      - 'kiteaudio-midi-coremidi/**'
      - 'kiteaudio-synth/**'
      - 'kiteaudio-output/**'
      - 'kiteaudio-core/**'
      - 'kotlin'
      - 'kotlin.bat'
      - 'project.yaml'
      - 'library.module-template.yaml'
      - 'kmp.module-template.yaml'
      - 'libs.versions.toml'
      - 'build-plugins/**'
      - '.github/workflows/instruments.yml'
      - '.github/scripts/web-tests/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KOTLIN_CLI_NO_WELCOME_BANNER: 1

jobs:
  # The JVM tests cover the common code of all five modules. The device tests of
  # the MIDI and output modules report themselves as skipped on a runner that has no device.
  jvm:
    name: JVM tests, API check and Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache the Kotlin Toolchain downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/JetBrains/Kotlin
          key: kotlin-toolchain-${{ runner.os }}-${{ hashFiles('kotlin', 'project.yaml', '**/module.yaml', '*.module-template.yaml', 'libs.versions.toml', 'build-plugins/**/plugin.yaml') }}
          restore-keys: kotlin-toolchain-${{ runner.os }}-

      - name: JVM tests
        run: ./kotlin test -m kiteaudio-midi -m kiteaudio-midi-devices -m kiteaudio-midi-coremidi -m kiteaudio-synth -m kiteaudio-output -p jvm

      - name: Public API check
        if: ${{ !cancelled() }}
        run: ./kotlin check abi -m kiteaudio-midi -m kiteaudio-midi-devices -m kiteaudio-midi-coremidi -m kiteaudio-synth -m kiteaudio-output

      # One documentation sample plays a decoded file through the output module.
      - name: Documentation samples
        if: ${{ !cancelled() }}
        run: ./kotlin test -m docs-samples

      # sdkmanager is not on PATH on the runner, so call it by its full path.
      - name: Install the required Android SDK
        if: ${{ !cancelled() }}
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;37.0.0"'

      - name: Android build
        if: ${{ !cancelled() }}
        run: ./kotlin build -m kiteaudio-midi -m kiteaudio-midi-devices -m kiteaudio-synth -m kiteaudio-output -p android

      # These tests run on the runner's JVM. They drive the Android output with a fake track.
      - name: Android output tests
        if: ${{ !cancelled() }}
        run: ./kotlin test -m kiteaudio-output -p android

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ !cancelled() }}
        with:
          node-version: '26'

      # `./kotlin test` cannot run the JS and wasmWasi tests, and it runs wasmJs
      # only in a browser. The script links them and runs them in Node, as ci.yml
      # does for the codec modules. The output module has no wasmWasi build.
      - name: JS, wasmJs and wasmWasi tests in Node
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/web-tests/run.py --module kiteaudio-midi --module kiteaudio-synth --module kiteaudio-output

  # The Apple source sets of the MIDI device and output modules compile only on
  # a Mac. This job runs the macOS tests of the four multiplatform modules and the
  # CoreMIDI tests, which do real work only on macOS. The klib check reads the
  # klibs of the four Apple platforms, the js and wasmJs klibs of the modules
  # that build for the web, and the klibs of every other platform of the MIDI
  # and synth modules. Only a Mac can build all of them.
  apple:
    name: macOS tests, Apple klibs and klib API check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache the Kotlin Toolchain downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/JetBrains/Kotlin
          key: kotlin-toolchain-${{ runner.os }}-${{ hashFiles('kotlin', 'project.yaml', '**/module.yaml', '*.module-template.yaml', 'libs.versions.toml', 'build-plugins/**/plugin.yaml') }}
          restore-keys: kotlin-toolchain-${{ runner.os }}-

      # One platform per call, so the number of Kotlin/Native compiler processes stays small.
      - name: Build the Apple klibs
        run: |
          for platform in iosArm64 iosSimulatorArm64 iosX64 macosArm64; do
            ./kotlin build -m kiteaudio-midi -m kiteaudio-midi-devices -m kiteaudio-synth -m kiteaudio-output -p "$platform"
          done

      # The output module does not build for wasmWasi.
      - name: Build the web klibs
        run: |
          ./kotlin build -m kiteaudio-midi -m kiteaudio-synth -m kiteaudio-output -p js -p wasmJs
          ./kotlin build -m kiteaudio-midi -m kiteaudio-synth -p wasmWasi

      # One platform per call, as above. The linux and windows jobs run the tests of
      # linuxX64 and mingwX64. The other platforms are built here only, as ci.yml
      # does for the codec modules.
      - name: Build the klibs of the other native platforms
        run: |
          for platform in tvosArm64 tvosSimulatorArm64 watchosArm32 watchosArm64 watchosDeviceArm64 watchosSimulatorArm64 linuxX64 linuxArm64 mingwX64 androidNativeArm32 androidNativeArm64 androidNativeX86 androidNativeX64; do
            ./kotlin build -m kiteaudio-midi -m kiteaudio-synth -p "$platform"
          done

      - name: Public klib API check
        if: ${{ !cancelled() }}
        run: ./kotlin check klibAbi -m kiteaudio-midi -m kiteaudio-midi-devices -m kiteaudio-synth -m kiteaudio-output

      # One module per call. The toolchain starts one Kotlin/Native compiler
      # process of 3 GB per task with no limit, and the runner has 7 GB.
      # The runner has a virtual audio output device, so the AudioQueue tests run.
      - name: macOS tests
        if: ${{ !cancelled() }}
        run: |
          status=0
          for module in kiteaudio-midi kiteaudio-midi-devices kiteaudio-synth kiteaudio-output; do
            ./kotlin test -m "$module" -p macosArm64 || status=1
          done
          exit "$status"

      # CoreMIDI exists only on macOS, so this is the only job where these tests do real work.
      - name: CoreMIDI tests
        if: ${{ !cancelled() }}
        run: ./kotlin test -m kiteaudio-midi-coremidi -p jvm

  # The common tests of the MIDI and synth modules on Linux Native.
  linux:
    name: Linux Native tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache the Kotlin Toolchain downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/JetBrains/Kotlin
          key: kotlin-toolchain-${{ runner.os }}-${{ hashFiles('kotlin', 'project.yaml', '**/module.yaml', '*.module-template.yaml', 'libs.versions.toml', 'build-plugins/**/plugin.yaml') }}
          restore-keys: kotlin-toolchain-${{ runner.os }}-

      # One module per call. The toolchain starts one Kotlin/Native compiler
      # process of 3 GB per task with no limit.
      - name: Linux x64 tests of the MIDI module
        run: ./kotlin test -m kiteaudio-midi -p linuxX64

      - name: Linux x64 tests of the synth module
        if: ${{ !cancelled() }}
        run: ./kotlin test -m kiteaudio-synth -p linuxX64

  # MinGW binaries cross-compile on a Mac, but their tests can only run on Windows.
  windows:
    name: Windows Native tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache the Kotlin Toolchain downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/AppData/Local/JetBrains/Kotlin
          key: kotlin-toolchain-${{ runner.os }}-${{ hashFiles('kotlin.bat', 'project.yaml', '**/module.yaml', '*.module-template.yaml', 'libs.versions.toml', 'build-plugins/**/plugin.yaml') }}
          restore-keys: kotlin-toolchain-${{ runner.os }}-

      # Each module runs alone, with a time limit. If one of its tests hangs, the
      # step ends with its log, and the next module still runs.
      - name: MinGW x64 tests of the MIDI module
        timeout-minutes: 20
        run: .\kotlin.bat test -m kiteaudio-midi -p mingwX64

      - name: MinGW x64 tests of the synth module
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: .\kotlin.bat test -m kiteaudio-synth -p mingwX64
